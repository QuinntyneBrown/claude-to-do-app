<tb-app-shell title="Profile" [navItems]="navItems">
  @if (profile(); as p) {
    <div class="profile-page">
      @if (p.pendingEmail !== null) {
        <tb-email-change-banner
          [pendingEmail]="p.pendingEmail"
          (cancelled)="onProfileChanged($event)">
        </tb-email-change-banner>
      }

      <section class="profile-page__section">
        <h2 class="profile-page__heading">Account</h2>
        <tb-profile-summary [profile]="p"></tb-profile-summary>
      </section>

      <section class="profile-page__section">
        <h2 class="profile-page__heading">Display name</h2>
        <tb-display-name-edit
          [currentName]="p.displayName"
          (updated)="onProfileChanged($event)">
        </tb-display-name-edit>
      </section>

      <section class="profile-page__section">
        <h2 class="profile-page__heading">Email address</h2>
        <tb-email-change-form (requested)="onProfileChanged($event)"></tb-email-change-form>
      </section>

      <section class="profile-page__section">
        <h2 class="profile-page__heading">Password</h2>
        <tb-change-password-form></tb-change-password-form>
      </section>

      <section class="profile-page__section profile-page__section--actions">
        <button
          mat-stroked-button
          type="button"
          data-testid="sign-out-button"
          (click)="signOut()">
          <mat-icon>logout</mat-icon>
          Sign out
        </button>
      </section>

      <section class="profile-page__section">
        <h2 class="profile-page__heading">Danger zone</h2>
        <tb-delete-account-section (deleted)="onAccountDeleted()"></tb-delete-account-section>
      </section>
    </div>
  }
</tb-app-shell>
