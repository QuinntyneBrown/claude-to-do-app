<main class="password-reset-page">
  <tb-brand-icon class="password-reset-page__brand" label="Tickbox"></tb-brand-icon>

  <section class="password-reset-page__card">
    <h1 class="password-reset-page__title">Set a new password</h1>
    <p class="password-reset-page__subtitle">Choose a strong passphrase. We'll sign you in once it's set.</p>

    <tb-password-reset-complete-form
      [token]="token()"
      (completed)="onCompleted($event)">
    </tb-password-reset-complete-form>
  </section>
</main>
