<main class="password-reset-page">
  <tb-brand-icon class="password-reset-page__brand" label="Tickbox"></tb-brand-icon>

  <section class="password-reset-page__card">
    <h1 class="password-reset-page__title">Reset your password</h1>
    <p class="password-reset-page__subtitle">Enter the email associated with your account and we'll send a reset link.</p>

    <tb-password-reset-request-form></tb-password-reset-request-form>

    <p class="password-reset-page__footer">

    </p>
  </section>
</main>
