<form class="change-password-form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline" class="change-password-form__field">
    <mat-label>Current password</mat-label>
    <input
      matInput
      type="password"
      name="currentPassword"
      autocomplete="current-password"
      data-testid="current-password-input"
      [(ngModel)]="currentPassword" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="change-password-form__field">
    <mat-label>New password</mat-label>
    <input
      matInput
      type="password"
      name="newPassword"
      autocomplete="new-password"
      data-testid="new-password-input"
      [(ngModel)]="newPassword" />
  </mat-form-field>

  <tb-error-banner [message]="error()" testId="change-password-error"></tb-error-banner>

  <div class="change-password-form__actions">
    <button
      mat-flat-button
      color="primary"
      type="submit"
      data-testid="change-password-submit"
      [disabled]="submitting()">
      {{ submitting() ? 'Saving…' : 'Change password' }}
    </button>
  </div>
</form>
