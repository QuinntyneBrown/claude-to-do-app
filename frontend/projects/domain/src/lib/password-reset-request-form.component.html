<form class="reset-request" (ngSubmit)="submit()">
  <mat-form-field appearance="outline" class="reset-request__field">
    <mat-label>Email</mat-label>
    <input
      matInput
      name="email"
      type="email"
      autocomplete="email"
      data-testid="email-input"
      [(ngModel)]="email" />
  </mat-form-field>

  @if (error()) {
    <p class="reset-request__error" data-testid="reset-request-error" role="alert" aria-live="polite">{{ error() }}</p>
  }

  <button
    mat-flat-button
    color="primary"
    type="submit"
    class="reset-request__submit"
    data-testid="reset-request-submit"
    [disabled]="submitting() || submitted()">
    {{ submitting() ? 'Sending…' : 'Send reset link' }}
  </button>

  @if (submitted()) {
    <p class="reset-request__confirmation" data-testid="reset-request-confirmation">
      If that account exists, a reset link is on its way.
    </p>
  }
</form>
