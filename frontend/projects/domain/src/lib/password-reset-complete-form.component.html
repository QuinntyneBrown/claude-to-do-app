<form class="reset-complete" (ngSubmit)="submit()">
  <mat-form-field appearance="outline" class="reset-complete__field">
    <mat-label>New password</mat-label>
    <input
      matInput
      name="newPassword"
      type="password"
      autocomplete="new-password"
      data-testid="new-password-input"
      [(ngModel)]="newPassword" />
    <mat-hint>Must be at least 12 characters.</mat-hint>
  </mat-form-field>

  @if (error()) {
    <p class="reset-complete__error" data-testid="reset-complete-error" role="alert" aria-live="polite">{{ error() }}</p>
  }

  <button
    mat-flat-button
    color="primary"
    type="submit"
    class="reset-complete__submit"
    data-testid="reset-complete-submit"
    [disabled]="submitting()">
    {{ submitting() ? 'Updating…' : 'Set new password' }}
  </button>
</form>
