<form class="todo-edit-form" (ngSubmit)="save()">
  <mat-form-field appearance="outline" class="todo-edit-form__field">
    <mat-label>Title</mat-label>
    <input
      matInput
      name="title"
      maxlength="200"
      data-testid="todo-title-input"
      [(ngModel)]="title" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="todo-edit-form__field todo-edit-form__field--notes">
    <mat-label>Notes</mat-label>
    <textarea
      matInput
      rows="4"
      maxlength="2000"
      name="notes"
      data-testid="todo-notes-input"
      [(ngModel)]="notes"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="todo-edit-form__field">
    <mat-label>Due date</mat-label>
    <input
      matInput
      type="date"
      name="dueDate"
      data-testid="todo-due-date-input"
      [(ngModel)]="dueDate" />
  </mat-form-field>

  @if (isEditing) {
    <h3 class="todo-edit-form__section-title">Status</h3>
    <mat-chip-set>
      <mat-chip
        role="tab"
        data-testid="status-chip-incomplete"
        [highlighted]="status() === 'Incomplete'"
        (click)="setStatus('Incomplete')">
        Incomplete
      </mat-chip>
      <mat-chip
        role="tab"
        data-testid="status-chip-complete"
        [highlighted]="status() === 'Complete'"
        (click)="setStatus('Complete')">
        <mat-icon>check</mat-icon>
        Complete
      </mat-chip>
    </mat-chip-set>
  }

  <tb-error-banner [message]="error()" testId="todo-edit-error"></tb-error-banner>

  <div class="todo-edit-form__actions">
    @if (isEditing) {
      <button
        mat-stroked-button
        color="warn"
        type="button"
        data-testid="todo-delete"
        (click)="requestDelete()">
        <mat-icon>delete</mat-icon>
        Delete
      </button>
    }
    <button
      mat-flat-button
      color="primary"
      type="submit"
      class="todo-edit-form__save"
      data-testid="todo-save"
      [disabled]="submitting()">
      {{ submitting() ? 'Saving…' : 'Save' }}
    </button>
  </div>
</form>
