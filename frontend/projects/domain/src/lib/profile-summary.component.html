<dl class="profile-summary">
  <div class="profile-summary__row">
    <dt class="profile-summary__label">Email</dt>
    <dd class="profile-summary__value" data-testid="profile-email">{{ profile.email }}</dd>
  </div>
  <div class="profile-summary__row">
    <dt class="profile-summary__label">Display name</dt>
    <dd class="profile-summary__value" data-testid="profile-display-name">{{ profile.displayName }}</dd>
  </div>
</dl>
