<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Tickbox</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&display=swap" />
</head>
<body>
  <main class="auth-screen">
    <div class="auth-screen__brand">
      <span class="auth-screen__brand-icon material-symbols-outlined" aria-hidden="true">check_circle</span>
      <span class="auth-screen__brand-name">Tickbox</span>
    </div>

    <section class="auth-screen__card">
      <h1 class="auth-screen__title">Reset your password</h1>
      <p class="auth-screen__subtitle">Enter the email associated with your account and we'll send a reset link.</p>

      <form class="auth-screen__form" onsubmit="event.preventDefault(); document.getElementById('reset-confirm').hidden = false;">
        <label class="text-field">
          <div class="text-field__control">
            <span class="text-field__label">Email</span>
            <input class="text-field__input" type="email" value="ada@example.com" />
          </div>
        </label>

        <button class="button button--filled button--full" type="submit">Send reset link</button>
      </form>

      <div id="reset-confirm" hidden>
        <div class="snackbar" style="margin-top: var(--space-4);">
          <span class="material-symbols-outlined" aria-hidden="true">mark_email_read</span>
          <span>If that account exists, a reset link is on its way.</span>
        </div>
      </div>

      <p class="auth-screen__footer">
        Remembered it? <a href="sign-in.html">Back to sign in</a>
      </p>
    </section>
  </main>
</body>
</html>
